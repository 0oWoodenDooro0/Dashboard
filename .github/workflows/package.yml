name: Package & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: dashboard-linux
          - os: windows-latest
            artifact-name: dashboard-windows
          - os: macos-latest
            artifact-name: dashboard-macos

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Package Distribution for Current OS
        run: ./gradlew :desktopApp:packageDistributionForCurrentOS --stacktrace

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            desktopApp/build/compose/binaries/main/deb/
            desktopApp/build/compose/binaries/main/appimage/
            desktopApp/build/compose/binaries/main/msi/
            desktopApp/build/compose/binaries/main/exe/
            desktopApp/build/compose/binaries/main/dmg/
            desktopApp/build/compose/binaries/main/pkg/
          if-no-files-found: warn

  release:
    name: Create GitHub Release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.deb
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.msi
            release-artifacts/**/*.exe
            release-artifacts/**/*.dmg
            release-artifacts/**/*.pkg
            release-artifacts/**/*.zip
          generate_release_notes: true
